name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          find . -name "*.json" ! -path "./.venv/*" -print0 | xargs -0 -n1 python -m json.tool > /dev/null
      - name: tests
        run: uv run pytest -q
