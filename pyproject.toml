[project]
name = "network-topology-visualizer"
version = "0.1.0"
description = "Network Topology Visualizer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "networkx>=3.0",
    "netmiko>=4.0.0",
    "ntc-templates>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "jsonlint>=0.1",
    "ruff>=0.15.13",
]
